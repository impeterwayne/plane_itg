id = "plane-itg"
name = "Plane ITG"
version = "1.0.0"
description = "Plane tasks synchronizer, offline evidence crawler, video keyframe extractor, and multi-worktree task manager."

[[panes]]
id = "plane-popup"
title = "Plane tasks"
placement = "popup"
command = [
  "node",
  "-e",
  'const p=process.cwd();const r=p.startsWith("\\\\?\\")?p.slice(4):p;process.argv=["node",r+"/bin/popup.js","--popup"];require(r+"/bin/popup.js")'
]

[[actions]]
id = "tool-plane"
title = "Plane tasks"
description = "Open the Plane issue list and task synchronizer as a popup."
command = ["node", "bin/popup.js"]

[[actions]]
id = "plane-sync"
title = "Plane sync"
description = "Sync Plane tasks and offline evidence."
command = ["node", "bin/cli.js", "sync"]
